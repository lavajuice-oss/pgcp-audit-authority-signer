name: Shadow Signer Validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shadow:
    runs-on: ubuntu-24.04
    steps:
      - name: Fetch exact triggering commit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p repo
          git -C repo init -q
          git -C repo remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git -C repo fetch --depth 1 origin "$GITHUB_SHA"
          git -C repo checkout --detach FETCH_HEAD
      - name: Create isolated Python environment
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check --no-cache-dir -r repo/requirements-dev.txt
      - name: Run shadow signer tests
        run: .venv/bin/python -m pytest -q repo/tests
