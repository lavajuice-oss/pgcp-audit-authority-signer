name: Verify Production Custody

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-custody:
    environment:
      name: production
    runs-on: ubuntu-24.04
    steps:
      - name: Fetch exact triggering commit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p repo
          git -C repo init -q
          git -C repo remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git -C repo fetch --depth 1 origin "$GITHUB_SHA"
          git -C repo checkout --detach FETCH_HEAD
      - name: Create isolated Python environment
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check --no-cache-dir -r repo/requirements.txt
      - name: Verify custody-local public identity
        env:
          AUDIT_AUTHORITY_KEY_PEM_B64: ${{ secrets.AUDIT_AUTHORITY_KEY_PEM_B64 }}
        run: |
          set -euo pipefail
          .venv/bin/python repo/src/signer.py verify-custody > custody-verification-result.json
      - name: Enforce public-only result
        run: |
          set -euo pipefail
          .venv/bin/python - <<'PY'
          import json
          from pathlib import Path
          p = Path('custody-verification-result.json')
          raw = p.read_text(encoding='utf-8')
          forbidden = ('BEGIN PRIVATE KEY', 'PRIVATE KEY', 'AUDIT_AUTHORITY_KEY_PEM_B64')
          if any(token in raw for token in forbidden):
              raise SystemExit('secret-like material detected in custody result')
          data = json.loads(raw)
          if data.get('result') != 'PASS' or data.get('public_key_match') is not True:
              raise SystemExit('custody verification did not PASS')
          print(json.dumps(data, indent=2, sort_keys=True))
          PY
      - name: Display public-only verification evidence
        run: cat custody-verification-result.json
